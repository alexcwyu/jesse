[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jesse"
version = "3.3.1"
description = "A trading framework for cryptocurrencies"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Saleh Mir", email = "saleh@jesse.trade"},
]
keywords = ["trading", "cryptocurrency", "bitcoin", "ethereum", "backtest", "algorithmic-trading"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "arrow",
    "blinker",
    "click",
    "numpy",
    "pandas",
    "peewee",
    "psycopg2-binary",
    "pydash",
    "fnc",
    "pytest",
    "requests",
    "scipy",
    "statsmodels",
    "tabulate",
    "timeloop",
    "websocket-client",
    "wsaccel",
    "simplejson",
    "fastapi",
    "uvicorn",
    "websockets",
    "python-dotenv",
    "aiofiles",
    "PyJWT",
    "cryptography",
    "ecdsa",
    "optuna",
    "ray",
    "eth-account",
    "msgpack",
    "starkbank-ecdsa",
    "jesse-rust",
    "mcp>=1.28.1,<2",
    "httpx",
    "anyio",
    "joblib",
    "scikit-learn ; python_version < \"3.11\"",
    "scikit-learn ; python_version >= \"3.11\"",
    "matplotlib",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]

[tool.uv]
default-groups = ["dev"]

[project.urls]
Homepage = "https://jesse.trade"
Documentation = "https://docs.jesse.trade"
Repository = "https://github.com/jesse-ai/jesse"
"Bug Tracker" = "https://github.com/jesse-ai/jesse/issues"
Discord = "https://jesse.trade/discord"

[project.scripts]
jesse = "jesse:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/jesse"]

[tool.hatch.build.targets.sdist]
include = [
    "src/jesse/**",
    "README.md",
    "LICENSE",
]
exclude = [
    "tests/**",
    "assets/**",
]


[tool.hatch.version]
path = "src/jesse/version.py"

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF", "PERF", "TC", "PTH"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["jesse"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "-q", "--strict-markers", "--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true
filterwarnings = ["error"]


[tool.uv.sources]
jesse-rust = { path = "../jesse-rust", editable = true }
